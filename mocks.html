ho_lab .gw-card{min-width:0;display:flex;flex-direction:column;height:128px;border-radius:7px;background:#0e4e86;position:relative}.guess_who_lab .gw-portrait{height:105px;width:100%;background:linear-gradient(#fff7db,#fffdf4);border:4px solid #f8d056;border-bottom:5px solid #e5ac22;border-radius:6px;color:#242e37;padding:0;position:relative;transform-origin:center bottom;transition:transform .25s,opacity .25s;box-shadow:0 3px 0 #062f61;overflow:hidden}.guess_who_lab .gw-portrait svg{height:84px;width:100%;display:block;position:absolute;top:-5px}.guess_who_lab .gw-portrait span{position:absolute;bottom:0;left:0;right:0;background:#fff7dc;font-size:14px;font-weight:500;height:20px;line-height:20px;text-transform:uppercase;letter-spacing:.7px}.guess_who_lab .gw-card select{margin:4px 0 0;width:100%;height:22px;min-height:22px;border:0;border-radius:3px;font-size:11px;background:#074679;color:#d4e9f6;padding-left:5px}.guess_who_lab .gw-card.is-down .gw-portrait{transform:perspective(280px) rotateX(64deg);opacity:.42}.guess_who_lab .gw-footer{display:flex;align-items:center;justify-content:space-between;margin:26px 48px 0;font-size:16px;color:#365f82}.guess_who_lab .gw-feedback{font-weight:500}.guess_who_lab .gw-portrait:hover{border-color:#fff1a5}.guess_who_lab .gw-ask:active{transform:translateY(2px);border-bottom-width:2px}`,
mount(root){const down=new Set();let asked=0;const cards=[...root.querySelectorAll('.gw-card')],count=root.querySelector('.gw-count'),feedback=root.querySelector('.gw-feedback');function update(){cards.forEach((card,i)=>{card.classList.toggle('is-down',down.has(i));card.querySelector('button').setAttribute('aria-pressed',String(down.has(i)))});count.textContent=`${24-down.size} faces left`}
root.querySelector('.gw-board').onclick=e=>{const button=e.target.closest('[data-face]');if(!button)return;const i=+button.dataset.face;down.has(i)?down.delete(i):down.add(i);update()};
root.querySelector('.gw-ask').onclick=()=>{const trait=+root.querySelector('.gw-trait').value,want=root.querySelector('.gw-answer').value==='yes';specs.forEach(([hair,eyes,glasses,hat],i)=>{const match=trait<3?hair===trait:trait===3?!!eyes:trait===4?!!glasses:!!hat;if(match!==want)down.add(i)});asked++;update();feedback.textContent=`Question ${asked}: ${want?'Yes':'No'}! ${24-down.size} possible ${24-down.size===1?'person':'people'} left.`};
root.querySelector('.gw-reset').onclick=()=>{down.clear();asked=0;root.querySelectorAll('.gw-card select').forEach(s=>s.selectedIndex=0);feedback.textContent='A little question. A big clue.';update()};update();}
});
})();

</script>
<script>
const screens=window.mockScreens;
const appIds=new Set(['aim_chat','secure_tunnel','offsite_backup','media_library']);
screens.sort((a,b)=>Number(appIds.has(a.id))-Number(appIds.has(b.id))||a.title.localeCompare(b.title));
const picker=document.getElementById('screen-picker'),stage=document.getElementById('stage'),frame=document.getElementById('frame'),workspace=document.getElementById('workspace');
for(const [label,isApp] of [['Game screens',false],['App screens',true]]){
 const group=document.createElement('optgroup');group.label=label;
 for(const screen of screens.filter(s=>appIds.has(s.id)===isApp)){const option=document.createElement('option');option.value=screen.id;option.textContent=screen.title;group.append(option)}
 picker.append(group);
}
let active=null,view='mock',dispose=null,statusTimer;
function fit(){const style=getComputedStyle(workspace);const width=workspace.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);const height=workspace.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);const scale=Math.max(.05,Math.min(width/1280,height/720));frame.style.width=`${1280*scale}px`;frame.style.height=`${720*scale}px`;stage.style.transform=`scale(${scale})`}
function notify(message){const status=document.getElementById('status');status.textContent=message;status.classList.add('visible');clearTimeout(statusTimer);statusTimer=setTimeout(()=>status.classList.remove('visible'),1800)}
function show(id,requestedView='mock',updateURL=true){
 const screen=screens.find(s=>s.id===id)||screens.find(s=>s.id==='marlo_kart')||screens[0];
 if(typeof dispose==='function')dispose();dispose=null;
 active=screen;view=requestedView==='original'&&!screen.reference?'mock':requestedView;
 if(!['mock','original','current'].includes(view))view='mock';
 picker.value=screen.id;
 document.getElementById('screen-style').textContent=view==='mock'?screen.css:'';
 stage.replaceChildren();
 if(view==='mock'){stage.innerHTML=screen.html;if(screen.mount)dispose=screen.mount(stage.firstElementChild)}
 else{const image=document.createElement('img');image.className='gallery-image';image.src=view==='original'?screen.reference:(window.mockAssets?.[screen.id]||`screenshot-baselines/screens/${screen.id}_720p.png`);image.alt=`${view==='original'?'Original reference':'Current afterhours screen'}: ${screen.title}`;stage.append(image)}
 for(const button of document.querySelectorAll('[data-view]')){button.setAttribute('aria-pressed',String(button.dataset.view===view));button.disabled=button.dataset.view==='original'&&!screen.reference;button.title=button.disabled?'No original screenshot is stored for this screen':''}
 document.getElementById('screen-count').textContent=`${screens.indexOf(screen)+1} / ${screens.length}`;
 const detail=document.getElementById('screen-detail');detail.replaceChildren();const source=document.createElement('a');if(!window.mockAssets)source.href=`src/systems/screens/${screen.source}`;source.textContent=screen.source;detail.append(source,document.createTextNode(` · ${view==='original'?'Original reference':view==='current'?'Committed screenshot':screen.reference?'Reference-based mock':'Product / genre study'}`));
 document.title=`${screen.title} · afterhours mocks`;
 if(updateURL)history.replaceState(null,'',`#screen=${encodeURIComponent(screen.id)}&view=${view}`);
 fit();
}
function move(delta){show(screens[(screens.indexOf(active)+delta+screens.length)%screens.length].id,view)}
picker.addEventListener('change',()=>show(picker.value,view));
document.getElementById('previous').addEventListener('click',()=>move(-1));document.getElementById('next').addEventListener('click',()=>move(1));
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>show(active.id,button.dataset.view)));
stage.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button||button.disabled)return;
 if(button.hasAttribute('data-tab')||button.hasAttribute('data-choice')){const attribute=button.hasAttribute('data-tab')?'data-tab':'data-choice';for(const sibling of button.parentElement.querySelectorAll(`:scope > [${attribute}]`)){sibling.classList.toggle('active',sibling===button);sibling.setAttribute('aria-pressed',String(sibling===button))}}
 if(button.hasAttribute('data-toggle')){const on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(on));button.classList.toggle('active',on)}
 if(button.dataset.action)notify(button.dataset.action);
});
stage.addEventListener('input',event=>{if(event.target.type!=='range')return;const input=event.target;const output=input.parentElement.querySelector('output');if(output)output.value=input.value+(output.dataset.suffix||'')});
document.addEventListener('keydown',event=>{if(event.target.closest('input,select,textarea,[contenteditable]'))return;if(event.key==='['){event.preventDefault();move(-1)}else if(event.key===']'){event.preventDefault();move(1)}});
function restore(){const params=new URLSearchParams(location.hash.slice(1)||location.search.slice(1));show(params.get('screen')||'marlo_kart',params.get('view')||'mock',false)}
addEventListener('hashchange',restore);new ResizeObserver(fit).observe(workspace);restore();
</script>
